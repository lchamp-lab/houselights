# Checks every push and pull request: unit tests, Android Lint, detekt, and a minified release build.
# Needs a Gitea Actions runner with the "ubuntu-latest" label. TMDB_API_KEY is optional (a repository
# secret): without it the app builds and users enter their own key.
name: CI

on:
  push:
    branches: [main, "tech/**", "design/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, lint, detekt, release build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug detekt assembleRelease

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: reports
          path: app/build/reports/
