# Checks every push and pull request: unit tests, Android Lint, detekt (with and without the compiler's
# types), and a minified release build.
# Needs a Gitea Actions runner with the "ubuntu-latest" label and 4 GB for its job container. TMDB_API_KEY is optional (a repository
# secret): without it the app builds and users enter their own key.
name: CI

on:
  push:
    branches: [main, "tech/**", "design/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit: act_runner cannot resolve annotated tags ("unsupported
      # object type"), and a commit cannot move under the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history: versionCode is the number of commits (app/build.gradle.kts).
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Tests, lint, detekt, release build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        # Needs a runner container of 4 GB: the whole check peaks at 3.5 GB with a 2 GB heap and the
        # Kotlin compiler inside Gradle (measured; at 1.4 GB the kernel kills it while compiling).
        # The release is only built, never published: the runner's debug key signs it.
        # detektDebug and detektDebugUnitTest run the rules that need the compiler's types (coroutine
        # dispatchers, !!, unsafe casts, ignored results) on the main and test sources, compiled for
        # debug anyway. detektMain would compile and analyse the same sources once for each of seven
        # variants (6.5 min on its own, measured). Each keeps its own baseline (app/detekt-baseline-*.xml).
        # With them, the whole check from clean took 5.5 min and peaked at 2.9 GB with a 1.5 GB heap.
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          -Phouselights.debugSignedRelease=true
          testDebugUnitTest lintDebug detekt detektDebug detektDebugUnitTest assembleRelease

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3 (Gitea has no v4)
        with:
          name: reports
          path: app/build/reports/
