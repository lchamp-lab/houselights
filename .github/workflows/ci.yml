# Checks every push and pull request: unit tests, Android Lint, detekt (with and without the compiler's
# types), a minified release build, signed with the runner's debug key and never published, and the baseline
# profile's journeys compiled, every compilation and Lint failing on a warning.
# TMDB_API_KEY is optional (a repository secret): without it the app builds and users enter their own key.
# TRAKT_CLIENT_ID is optional too, and TRAKT_CLIENT_SECRET only for a Trakt app that has one: without them,
# the app builds and says it has no Trakt. A pull request from a fork gets no secret, and needs none.
# Beside it, « servers » runs the app's tests against real servers in Docker (tools/test-servers).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit, which cannot move under the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: versionCode is the number of commits (app/build.gradle.kts).
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component

      # Robolectric fetches the Android its tests run on (android-all-instrumented, 100 MB) with a
      # resolver of its own, into ~/.m2, which setup-gradle does not cache. Keyed by Robolectric's
      # version and the Android version the tests ask for.
      - name: Robolectric's key
        id: robolectric
        run: |
          version="$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          sdk="$(sed -n 's/^sdk=//p' app/src/test/resources/robolectric.properties)"
          echo "key=robolectric-$version-sdk$sdk" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      # The same checks as scripts/check.sh. A hosted runner has 16 GB: a 3 GB heap and the Kotlin compiler
      # inside Gradle fit with room to spare. 2 GB, enough until Compose 1.11 and KSP2, ran out compiling the debug
      # and release builds side by side.
      - name: Tests, lint, detekt, release build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          -Phouselights.debugSignedRelease=true
          testDebugUnitTest lintDebug detekt detektDebug detektDebugUnitTest assembleRelease
          :baselineprofile:compileNonMinifiedReleaseKotlin

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: app/build/reports/

  # The app against real servers (tools/test-servers/README.md): a Samba NAS, an unfs3 NAS, the same one sending its
  # replies in fragments (on 127.0.0.2) and a Jellyfin server in Docker, on sample files made here, every port on this
  # machine's loopback alone; then their tests (app.houselights.servers), which « check » skips. Beside « check », so it
  # never makes it longer, and with no secret.
  servers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component

      # The same Android for Robolectric as « check », from the same cache.
      - name: Robolectric's key
        id: robolectric
        run: |
          version="$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          sdk="$(sed -n 's/^sdk=//p' app/src/test/resources/robolectric.properties)"
          echo "key=robolectric-$version-sdk$sdk" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      # Samples, then the servers (built here, Jellyfin's image pulled at its digest), then Jellyfin's wizard and scan.
      - name: Test servers
        working-directory: tools/test-servers
        run: |
          # The NFS server answers on port 111: a portmapper of the runner's own would hold it.
          if sudo ss -ltnup | grep -q ':111 '; then sudo systemctl stop rpcbind.socket rpcbind.service; fi
          ./make-media.sh
          docker compose --profile jellyfin --profile fragments up --detach --build --wait
          ./bootstrap-jellyfin.sh

      - name: Servers' tests
        env:
          HOUSELIGHTS_TEST_SERVERS: "1"
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :app:testDebugUnitTest --tests 'app.houselights.servers.*'

      # Each class's count in the run's summary; a test skipped here means the servers were not seen, which fails.
      - name: Tests run
        run: |
          cd app/build/test-results/testDebugUnitTest
          for result in TEST-app.houselights.servers.*.xml; do
            sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/- \1: \2 tests, \3 skipped, \4 failed, \5 errors/p' "$result"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -l 'skipped="[1-9]' TEST-app.houselights.servers.*.xml

      - name: Servers' logs
        if: failure()
        working-directory: tools/test-servers
        run: docker compose --profile jellyfin --profile fragments logs --no-color --tail 300

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servers-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
