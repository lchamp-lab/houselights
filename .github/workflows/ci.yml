# Checks every push and pull request in four parts side by side, each on a runner of its own: the unit tests, Android
# Lint, detekt (with and without the compiler's types), and a minified release build, signed with the runner's debug key
# and never published, with the baseline profile's journeys compiled; every compilation and Lint failing on a warning.
# « check » passes once all four have: the check a merge to main waits for (the repository's ruleset on main).
# TMDB_API_KEY is optional (a repository secret): without it the app builds and users enter their own key.
# TRAKT_CLIENT_ID is optional too, and TRAKT_CLIENT_SECRET only for a Trakt app that has one: without them,
# the app builds and says it has no Trakt. Only the unit tests and the release build, whose code is built with them,
# get them. A pull request from a fork gets no secret, and needs none.
# Beside them, « servers » runs the app's tests against real servers in Docker (tools/test-servers).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same checks as scripts/check.sh, in four parts: each compiles what it checks, so that none waits for another.
  parts:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      # Each part runs to its end: a failure in one never hides another's.
      fail-fast: false
      matrix:
        include:
          - name: unit tests
            id: tests
            # In three JVMs side by side, each with a heap of 1.5 GB (app/build.gradle.kts, houselights.testForks).
            gradle: testDebugUnitTest -Phouselights.testForks=3 -Phouselights.testHeap=1536m
            secrets: true
            robolectric: true
          - name: lint
            id: lint
            gradle: lintDebug
          - name: detekt
            id: detekt
            gradle: detekt detektDebug detektDebugUnitTest
          - name: release build
            id: release
            gradle: assembleRelease :baselineprofile:compileNonMinifiedReleaseKotlin
            secrets: true
    steps:
      # Actions are pinned to a commit, which cannot move under the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: versionCode is the number of commits (app/build.gradle.kts).
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component

      # Robolectric fetches the Android its tests run on (android-all-instrumented, 100 MB each) with a
      # resolver of its own, into ~/.m2, which setup-gradle does not cache. The unit tests run on several
      # (28 by default, then those named by @Config(sdk = ...) and the constants it takes), so their cache is
      # keyed by Robolectric's version and by those lines of the tests: a test on a new Android makes a new
      # entry, which starts from the previous one. It is this job's alone, « servers » has a key of its own:
      # an entry is written once, by whichever job reaches it first, and with one key for both the unit tests
      # were left with what « servers » had fetched, 28 alone.
      - name: Robolectric's key
        if: matrix.robolectric
        id: robolectric
        run: |
          version="$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          androids="$( { sed -n 's/^sdk=/default /p' app/src/test/resources/robolectric.properties; grep -rhE '(\bsdk *=|SHADER_FILTERS *=)' app/src/test/java || true; } | sort -u | sha256sum | cut -c1-12)"
          echo "prefix=robolectric-$version-tests-" >> "$GITHUB_OUTPUT"
          echo "key=robolectric-$version-tests-$androids" >> "$GITHUB_OUTPUT"

      - if: matrix.robolectric
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}
          restore-keys: ${{ steps.robolectric.outputs.prefix }}

      # What the runner has, which the settings below count on: four processors and 16 GB for a public repository's.
      - name: The runner
        run: |
          echo "$(nproc) processors: $(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | sort -u)"
          free -m

      # A worker per processor and a 6 GB heap; the Kotlin compiler in a daemon of its own, of 3 GB, where on the same
      # processors it compiled the debug build a little faster than inside Gradle's JVM, and the unit tests' classes,
      # compiled after it, in half the time. With the unit tests' three JVMs of 1.5 GB, all within the runner's 16 GB.
      - name: ${{ matrix.name }}
        env:
          TMDB_API_KEY: ${{ matrix.secrets && secrets.TMDB_API_KEY || '' }}
          TRAKT_CLIENT_ID: ${{ matrix.secrets && secrets.TRAKT_CLIENT_ID || '' }}
          TRAKT_CLIENT_SECRET: ${{ matrix.secrets && secrets.TRAKT_CLIENT_SECRET || '' }}
        run: >-
          ./gradlew --no-daemon --max-workers="$(nproc)"
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=daemon
          -Pkotlin.daemon.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"
          -Phouselights.debugSignedRelease=true
          ${{ matrix.gradle }}

      # The ten slowest classes in the run's summary, whether the tests passed or not: a class that becomes slow
      # (one took two thirds of the suite for two days) is seen on the pull request that made it so. Skipped when
      # the build stopped before any test ran.
      - name: Slowest test classes
        if: matrix.robolectric && !cancelled() && hashFiles('app/build/test-results/testDebugUnitTest/*.xml') != ''
        working-directory: app/build/test-results/testDebugUnitTest
        run: |
          {
            echo "### Slowest test classes"
            echo
            echo "| Class | Tests | Seconds |"
            echo "|---|--:|--:|"
            for result in TEST-*.xml; do
              sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*" timestamp="[^"]*" hostname="[^"]*" time="\([0-9.]*\)".*/\3 \2 \1/p' "$result"
            done | sort -rn | awk "NR <= 10" | while read -r seconds tests name; do
              echo "| ${name#app.houselights.} | $tests | $seconds |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The JUnit results (XML, a few MB) kept on success too, to compare the times of one run with another's.
      - name: Test results
        if: matrix.robolectric && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 30

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.id }}
          path: app/build/reports/

  # The check a merge to main waits for, under the name it has always had: it passes once every part has, and fails
  # once one has failed, timed out or was cancelled (a job skipped would count as passed).
  check:
    needs: parts
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.parts.result }}
        run: |
          echo "Unit tests, lint, detekt and the release build: $PARTS"
          [ "$PARTS" = success ]

  # The app against real servers (tools/test-servers/README.md): a Samba NAS, an unfs3 NAS, the same one sending its
  # replies in fragments (on 127.0.0.2) and a Jellyfin server in Docker, on sample files made here, every port on this
  # machine's loopback alone; then their tests (app.houselights.servers), which the unit tests skip. Beside the parts, so
  # it never makes CI longer, and with no secret.
  servers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component

      # Its tests run on the default Android alone: a cache of its own, not the unit tests' (see « parts »).
      - name: Robolectric's key
        id: robolectric
        run: |
          version="$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          sdk="$(sed -n 's/^sdk=//p' app/src/test/resources/robolectric.properties)"
          echo "key=robolectric-$version-servers-sdk$sdk" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      # Samples, then the servers (built here, Jellyfin's image pulled at its digest), then Jellyfin's wizard and scan.
      - name: Test servers
        working-directory: tools/test-servers
        run: |
          # The NFS server answers on port 111: a portmapper of the runner's own would hold it.
          if sudo ss -ltnup | grep -q ':111 '; then sudo systemctl stop rpcbind.socket rpcbind.service; fi
          ./make-media.sh
          docker compose --profile jellyfin --profile fragments up --detach --build --wait
          ./bootstrap-jellyfin.sh

      - name: Servers' tests
        env:
          HOUSELIGHTS_TEST_SERVERS: "1"
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          :app:testDebugUnitTest --tests 'app.houselights.servers.*'

      # Each class's count in the run's summary; a test skipped here means the servers were not seen, which fails.
      - name: Tests run
        run: |
          cd app/build/test-results/testDebugUnitTest
          for result in TEST-app.houselights.servers.*.xml; do
            sed -n 's/.*<testsuite name="\([^"]*\)" tests="\([0-9]*\)" skipped="\([0-9]*\)" failures="\([0-9]*\)" errors="\([0-9]*\)".*/- \1: \2 tests, \3 skipped, \4 failed, \5 errors/p' "$result"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          ! grep -l 'skipped="[1-9]' TEST-app.houselights.servers.*.xml

      - name: Servers' logs
        if: failure()
        working-directory: tools/test-servers
        run: docker compose --profile jellyfin --profile fragments logs --no-color --tail 300

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servers-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
