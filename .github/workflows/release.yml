# Publishes a release when a tag vX.Y.Z (or vX.Y.Z-beta.N, a pre-release) is pushed: the checks of CI,
# then the release APK signed with the project's key, its SHA-256, the update.json the app's updater reads, and notes
# from docs/releases/X.Y.Z/ (or, without it, the commits since the previous tag, each one a sentence of what is now
# true).
#
# Two jobs, so that what the checks run (Gradle plugins, lint checks, detekt rules, test libraries,
# Robolectric's Android) never sees the signing key: check has no secret and a read-only token, which only its step
# reading the published releases, before any build, has in its environment. Once it passes, release writes the key
# for assembleRelease alone and erases it; its token, which can write, is left in no .git/config and only the step
# that publishes has it in its environment.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   HOUSELIGHTS_KEYSTORE           the release keystore, in base64 (base64 -w0 houselights-release.jks)
#   HOUSELIGHTS_KEYSTORE_PASSWORD  its password (the store's and the key's, one in a PKCS12 keystore)
#   TMDB_API_KEY                   optional: the project's TMDB key, never a personal one; without it users
#                                  enter their own in the app's settings
#   TRAKT_CLIENT_ID                optional: the project's Trakt app; without it Settings says the build has
#                                  no Trakt
#   TRAKT_CLIENT_SECRET            optional: only for a Trakt app that has one; built into the APK, it can be read there
#   TRAKT_REDIRECT_URI             optional: the Trakt app's redirect URI, when not the project's (README, Trakt)
#
# To release: set versionName in app/build.gradle.kts, write docs/releases/X.Y.Z/en.md (and fr.md), commit, then tag
# that commit (git tag -a v0.2.0 -m "Houselights 0.2.0" && git push origin v0.2.0). A final needs at least one commit
# after its last beta: its versionCode, the commit count, must grow. Before a first beta whose updater has never run, a
# dry run with two locally signed builds against a test repository (-Phouselights.updateRepo=owner/repo) tries the
# update from one to the next (CONTRIBUTING, Releases).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: versionCode is the number of commits.
          fetch-depth: 0
          # No token left in .git/config for the build to find.
          persist-credentials: false

      - name: The tag is the code's version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          base="${tag%%-*}"
          if [ "$base" != "$code" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but app/build.gradle.kts says versionName = \"$code\"."
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      # The app offers a release only above its installed versionCode, and Android refuses a lower one: the new one, the
      # commit count, must be above every release published (a hotfix branched from an old tag, or a history rewritten,
      # would count fewer). The read-only token, here alone and before any build; 946 is v0.3.0's, the last release
      # published without an update.json.
      - name: The versionCode grows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code="$(git rev-list --count HEAD)"
          highest=946
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName --jq '.[].tagName')"
          for tag in $tags; do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            published="$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern update.json --output - 2>/dev/null \
              | jq -r '.versionCode // empty' 2>/dev/null || true)"
            if [ -n "$published" ] && [ "$published" -gt "$highest" ]; then highest="$published"; fi
          done
          if [ "$code" -le "$highest" ]; then
            echo "::error::versionCode $code is not above $highest, already published: tag a commit that descends from the last release. A final needs at least one commit after its last beta (its docs/releases notes give one)."
            exit 1
          fi
          echo "versionCode $code, above $highest"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component
        with:
          # A release builds from nothing a cache could have carried in.
          cache-disabled: true

      # CI's checks, without its secrets, which no check needs. lintVitalRelease is the lint assembleRelease
      # would otherwise run beside the key.
      - name: Tests, lint, detekt
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          testDebugUnitTest lintDebug lintVitalRelease detekt detektDebug detektDebugUnitTest
          :baselineprofile:compileNonMinifiedReleaseKotlin

  release:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      APK: Houselights-${{ needs.check.outputs.version }}.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: versionCode is the number of commits, the notes go back to the last tag.
          fetch-depth: 0
          # No token left in .git/config for the build to find.
          persist-credentials: false

      # The project's signing certificate, from its only copy (gradle.properties), which the app pins too. A release
      # signed with any other key could not update the app people have installed: the build stops rather than publish
      # one.
      - name: The project's certificate
        run: |
          cert="$(sed -n 's/^houselights\.releaseCertSha256=\([0-9a-f]\{64\}\)$/\1/p' gradle.properties)"
          if [ -z "$cert" ]; then
            echo "::error::gradle.properties names no houselights.releaseCertSha256 of 64 lowercase hex digits."
            exit 1
          fi
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component
        with:
          cache-disabled: true

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.HOUSELIGHTS_KEYSTORE }}
          PASSWORD: ${{ secrets.HOUSELIGHTS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::The secrets HOUSELIGHTS_KEYSTORE and HOUSELIGHTS_KEYSTORE_PASSWORD are needed."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/houselights-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=houselights\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/houselights-release.jks" "$PASSWORD" "$PASSWORD" > keystore.properties

      # The release alone: its lint ran in check, without the key. Named as its tag, a beta's included (0.4.0-beta.1),
      # which the updater tells from its final by that name.
      - name: The signed release
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          -PversionName="$VERSION"
          assembleRelease -x lintVitalRelease

      - name: Forget the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/houselights-release.jks"

      - name: The APK bears the project's key
        run: |
          built="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          cp "$built" "$APK"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo "apksigner $("$apksigner" version)"
          certs="$("$apksigner" verify --print-certs "$APK")"
          echo "$certs"
          # "Signer #1 certificate SHA-256 digest: …" (build-tools 35) or "V3.0 Signer: certificate SHA-256
          # digest: …" (37): every signer must be the project's key, so one distinct digest at most passes.
          signed="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
          if [ "$signed" != "$CERT_SHA256" ]; then
            echo "::error::The APK is signed with $signed, not the project's key $CERT_SHA256."
            exit 1
          fi
          sha256sum "$APK" > "$APK.sha256"
          # The same file under a name that never changes: .../releases/latest/download/Houselights.apk is
          # always the latest release.
          cp "$APK" Houselights.apk
          # R8's map from the shortened names back to the code's, to read this release's logs and traces; it
          # holds class and member names only.
          cp app/build/outputs/mapping/release/mapping.txt "${APK%.apk}-mapping.txt"

      # What is new: docs/releases/X.Y.Z/en.md (and fr.md) when written, at most 4000 characters each, as the app shows
      # them; else the subjects of the commits since the previous tag, in English, whole ones up to 4000 characters.
      - name: Notes
        run: |
          dir="docs/releases/$VERSION"
          if [ -d "$dir" ]; then
            if [ ! -s "$dir/en.md" ]; then
              echo "::error::$dir has no en.md: the notes in English are the ones every language falls back to."
              exit 1
            fi
            for lang in en fr; do
              [ -f "$dir/$lang.md" ] || continue
              length="$(wc -m < "$dir/$lang.md")"
              if [ "$length" -gt 4000 ]; then
                echo "::error::$dir/$lang.md holds $length characters, 4000 at most: the app shows no more."
                exit 1
              fi
              cp "$dir/$lang.md" "notes-$lang.md"
            done
          else
            previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
            range="${previous:+$previous..}$GITHUB_REF_NAME"
            git log --no-merges --format='- %s' "$range" -- app/src \
              | awk '{ n += length($0) + 1; if (n > 4000) exit; print }' > notes-en.md
            [ -s notes-en.md ] || echo "- Houselights $VERSION" > notes-en.md
          fi
          {
            echo "## What's new"
            echo
            cat notes-en.md
            echo
            echo "## Install"
            echo
            echo "Update from the app (Settings > About > Updates), or download \`$APK\` and install it on your player"
            echo "(README, Install). It updates an earlier release in place, its library and watch history kept."
            echo
            echo "SHA-256 of the APK: \`$(cut -d' ' -f1 "$APK.sha256")\`"
            echo
            echo "Signing certificate SHA-256: \`$CERT_SHA256\`"
          } > notes.md

      # The manifest the app's updater reads (app/src/main/java/app/houselights/update/UpdateManifest.kt), read from the
      # APK itself, never recomputed, and checked before it is published.
      - name: update.json
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          badging="$("$aapt2" dump badging "$APK")"
          package="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          code="$(printf '%s\n' "$badging" | sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p")"
          name="$(printf '%s\n' "$badging" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p")"
          sdk="$(printf '%s\n' "$badging" | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p")"
          if [ "$package" != "app.houselights" ] || [ "$name" != "$VERSION" ] || [ -z "$code" ] || [ -z "$sdk" ]; then
            echo "::error::The APK reads package '$package', versionName '$name', versionCode '$code', minSdk '$sdk'."
            exit 1
          fi
          if [ -n "$PRERELEASE" ]; then prerelease=true; else prerelease=false; fi
          [ -f notes-fr.md ] || : > notes-fr.md
          jq -n \
            --arg tag "$GITHUB_REF_NAME" --arg versionName "$name" --argjson versionCode "$code" \
            --argjson prerelease "$prerelease" --argjson minSdk "$sdk" \
            --arg apk "$APK" --argjson size "$(stat -c %s "$APK")" --arg sha256 "$(cut -d' ' -f1 "$APK.sha256")" \
            --arg cert "$CERT_SHA256" --rawfile en notes-en.md --rawfile fr notes-fr.md \
            '{
              schema: 1,
              tag: $tag,
              versionName: $versionName,
              versionCode: $versionCode,
              prerelease: $prerelease,
              minSdk: $minSdk,
              apk: {name: $apk, size: $size, sha256: $sha256},
              certSha256: $cert,
              notes: ({en: $en} + (if $fr == "" then {} else {fr: $fr} end))
            }' > update.json
          jq -e --arg tag "$GITHUB_REF_NAME" --arg apk "$APK" '
            .schema == 1 and .tag == $tag and .versionName == ($tag | ltrimstr("v"))
            and (.versionCode | type == "number" and . > 0) and (.prerelease | type == "boolean")
            and (.minSdk | type == "number") and .apk.name == $apk and (.apk.size | type == "number" and . > 0)
            and (.apk.sha256 | test("^[0-9a-f]{64}$")) and (.certSha256 | test("^[0-9a-f]{64}$"))
            and (.notes.en | type == "string" and length > 0 and length <= 4000)
            and ((.notes.fr // "") | length <= 4000)
          ' update.json
          cat update.json

      # A draft first, all its files uploaded, then published: no one ever sees a release whose APK or update.json is
      # still on its way.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Houselights $VERSION" \
            --notes-file notes.md ${PRERELEASE:+"$PRERELEASE"} \
            "$APK" "$APK.sha256" Houselights.apk "${APK%.apk}-mapping.txt" update.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
