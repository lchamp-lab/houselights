# The libraries the app ships, for GitHub's dependency graph, and what a pull request changes in them (CONTRIBUTING,
# Checks). GitHub reads the workflows' actions by itself, but not a Gradle build: « graph » resolves the release's
# runtime classpath, what reaches the player, and submits it for main and the release branches as they move
# (Dependabot's alerts and security updates read main's) and for each pull request; « review » then fails a pull
# request that brings a dependency with a known vulnerability. A pull request from a fork has a read-only token and no
# graph: its review sees the actions alone.
name: Dependencies

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The dependency submission API asks for it.
      contents: write
    steps:
      # Actions are pinned to a commit, which cannot move under the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # The release's runtime classpath and nfs-client, whose jar the app takes as it writes it (app/build.gradle.kts),
      # alone: the build's plugins, Lint, detekt and the tests never reach the player.
      - uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT
        with:
          dependency-graph-include-projects: "^:app$"
          dependency-graph-include-configurations: "^(releaseRuntimeClasspath|nfsClient)$"

  review:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The graph just submitted may take a moment to be read.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
          comment-summary-in-pr: never
          # Netty 3 (io.netty:netty 3.10.6.Final, the last), which nfs-client is built on (app/build.gradle.kts), has
          # no fix for these: they are in its HTTP, HTTP/2 and multipart codecs and its Bzip2 and Snappy decoders, and
          # nfs-client and the app's RPCRecordDecoder use its bootstrap, buffers, NIO socket channels and FrameDecoder
          # alone, R8 leaving the rest out of the APK.
          allow-ghsas: >-
            GHSA-cqqj-4p63-rrmm, GHSA-p979-4mfw-53vg, GHSA-p2v9-g2qv-p635, GHSA-wx5j-54mm-rqqq,
            GHSA-f256-j965-7f32, GHSA-wm47-8v5p-wjpj, GHSA-5mcr-gq6c-3hq2, GHSA-grg4-wf29-r9vv,
            GHSA-9vjp-v76f-g363
