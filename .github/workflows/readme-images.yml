# Renders the README's images (README.md, docs/images): the capture test (app/src/test/.../readme) shoots the app's
# own screens over a library of recent films and shows that TMDB names in English, then tools/readme-images/compose.py
# frames them. Push a readme-images/* branch (or, once this file is on main, Run workflow), and commit the artifact
# « readme-images » in docs/images (CONTRIBUTING, README's images). TMDB_API_KEY, the repository's secret, reaches the
# test alone; nothing it read from TMDB is uploaded but the images.
name: README images

on:
  workflow_dispatch:
  push:
    branches: ['readme-images/**']

permissions:
  contents: read

concurrency:
  group: readme-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2, MIT; v6 caches through a proprietary component

      # Robolectric's Android for the captures (README_SDK), kept as CI keeps its own.
      - name: Robolectric's key
        id: robolectric
        run: |
          version="$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          sdk="$(sed -n 's/^const val README_SDK = \([0-9]*\)$/\1/p' app/src/test/java/app/houselights/readme/ReadmeCamera.kt)"
          echo "key=robolectric-$version-sdk$sdk" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      # The release's screens, as users have them; the captures alone.
      - name: Captures
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          HOUSELIGHTS_README: ${{ runner.temp }}/readme/captures
          HOUSELIGHTS_README_CACHE: ${{ runner.temp }}/readme/cache
        run: >-
          ./gradlew --no-daemon --max-workers=4 --continue
          :app:testReleaseUnitTest --tests 'app.houselights.readme.*'

      # What failed, in the log, whose secrets GitHub masks, rather than the reports uploaded as they are.
      - name: What failed
        if: failure()
        run: |
          shopt -s nullglob
          for result in app/build/test-results/testReleaseUnitTest/TEST-app.houselights.readme.*.xml; do
            sed -n '/<failure/,/<\/failure>/p' "$result" | head -n 120
          done

      # Whatever was shot is framed, even when a shot failed: the run still fails.
      - name: Pillow
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/pillow"
          "$RUNNER_TEMP/pillow/bin/pip" install --quiet --require-hashes --only-binary=:all: -r tools/readme-images/requirements.txt

      - name: Images
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/pillow/bin/python" -I tools/readme-images/compose.py \
            "$RUNNER_TEMP/readme/captures" "$RUNNER_TEMP/readme/images" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-images
          path: ${{ runner.temp }}/readme/images/
          if-no-files-found: error

      # The captures as the test wrote them, to frame them again without a run: the stills, the frames, what TMDB named.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-captures
          path: ${{ runner.temp }}/readme/captures/
          if-no-files-found: warn
          retention-days: 7
