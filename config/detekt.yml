# Built on detekt's defaults (buildUponDefaultConfig); only what Compose and this codebase need differs.
# No baseline: a finding is fixed, else its rule is set aside where it stands with its reason (CONTRIBUTING, Checks).

naming:
  FunctionNaming:
    # Composables are named like types.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Design tokens and composition locals are PascalCase (HlSpace, LocalHlType).
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

complexity:
  LongParameterList:
    # Composables take their styling as parameters with defaults.
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 25
    ignorePrivate: true
    # A Room DAO is a list of queries.
    ignoreAnnotated: ['Dao']

style:
  MagicNumber:
    # Layout values, colours and timings are read where they are used.
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  WildcardImport:
    active: true
  UnusedImports:
    # An import nothing uses misleads whoever reads the file about what it depends on.
    active: true

performance:
  SpreadOperator:
    # Only used to pass a handful of migrations or arguments once; the copy costs nothing.
    active: false

coroutines:
  InjectDispatcher:
    # Dispatchers.IO wraps blocking reads only (SMB, NFS, files), where they happen; tests run them for real.
    active: false

# Compose's own rules (io.nlopez.compose.rules, https://mrmans0n.github.io/compose-rules/): every one on, the opt-in
# Material2 too; what differs says why.
Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    # The design system hands down the theme and what a surface lies in, as MaterialTheme does (DESIGN.md): colours and
    # type, the ground and the film's light, the house lights and the backdrop, focus groups, rows, cards and plates,
    # the sheet or header a control is in. Beside them, the launch screen, an error's fix, and the view model Settings'
    # panes share. A new one is added here with its reason.
    allowedCompositionLocals:
      - LocalHlColors
      - LocalHlType
      - LocalGround
      - LocalAmbient
      - LocalHouseLights
      - LocalBackdropSettled
      - LocalBackdropRelay
      - LocalGroupFocus
      - LocalGroupFocused
      - LocalRowFrame
      - LocalRaise
      - LocalArtworkRecede
      - LocalCutPosters
      - LocalPlate
      - LocalRoomField
      - LocalInSheet
      - LocalInHeader
      - LocalLaunchScreen
      - LocalErrorFix
      - LocalSettingsViewModel
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ContentSlotReused:
    active: true
  ContentTrailingLambda:
    active: true
  DefaultsVisibility:
    active: true
  LambdaParameterEventTrailing:
    active: true
  LambdaParameterInRestartableEffect:
    active: true
  Material2:
    # The app draws with its design system on tv-material 3: no Material 2.
    active: true
  ModifierClickableOrder:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNaming:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewNaming:
    # Opt-in, and the app has no preview: the catalogue shows every component in its states (DESIGN.md, Catalogue).
    active: false
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  UnstableCollections:
    # Opt-in, for a compiler without strong skipping: Kotlin 2's skips a composable handed the same list again, as the
    # view models' states hand on the lists they keep, so List stays, with no immutable collections library.
    active: false
  ViewModelForwarding:
    active: true
    # A screen gets its view model (a default parameter) and hands it to the page that draws it, which tests compose
    # with a view model over fake sources; the page's parts take its state and events.
    allowedForwarding:
      - DetailPage
      - IdentifyPage
      - ToIdentifyPage
      - Wall
      - AddFolderForm
      - JellyfinLoginForm
      - WatchScreen
  ViewModelInjection:
    active: true

# ktlint 0.50.0's rules (detekt-formatting), the code's style: their defaults in IntelliJ IDEA's code style (android:
# false), but what is said here. detekt reads this file, not .editorconfig, which gives the pre-commit hook's ktlint the
# same settings: a setting changed here is changed there (CONTRIBUTING, Checks).
formatting:
  # Lines are wrapped at style's MaxLineLength, 140, which holds them, comments included.
  ArgumentListWrapping:
    maxLineLength: 140
  FunctionReturnTypeSpacing:
    maxLineLength: 140
  MaximumLineLength:
    active: false
  ParameterListWrapping:
    maxLineLength: 140
  ParameterWrapping:
    maxLineLength: 140
  PropertyWrapping:
    maxLineLength: 140
  Wrapping:
    maxLineLength: 140
  Filename:
    # As naming's MatchingDeclarationName: a file is named for what it holds (Routes.kt, Theme.kt), not its one class.
    active: false
  SpacingBetweenDeclarationsWithComments:
    # The design tokens are tables, each token under its comment and no blank line between them (DESIGN.md, Tokens).
    excludes: ['**/ui/design/Color.kt', '**/ui/design/Dimens.kt', '**/ui/design/Motion.kt']
  TrailingCommaOnCallSite:
    # A list over several lines ends with a comma, so that adding to it changes one line.
    active: true
  TrailingCommaOnDeclarationSite:
    active: true
