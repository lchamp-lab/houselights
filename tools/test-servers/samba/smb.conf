# A home NAS's file service as a Synology or a QNAP sets it up: SMB2 at least, SMB3 allowed, signing and
# encryption as Samba's defaults (offered, never required), NetBIOS off, guest access only where a share allows it.
# Test-only: the account houselights / houselights-test reads generated sample files and nothing else.

[global]
    server string = Houselights test NAS
    netbios name = HOUSELIGHTS-NAS
    workgroup = WORKGROUP
    security = user
    passdb backend = tdbsam
    # Synology's "Minimum SMB protocol: SMB2", its maximum SMB3.
    server min protocol = SMB2_02
    server max protocol = SMB3
    # A name the NAS does not know signs in as its guest, as on a NAS whose guest account is on; a known name with a
    # wrong password is refused.
    map to guest = Bad User
    guest account = nobody
    # Port 445 alone, no NetBIOS (Synology's default since DSM 7).
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    unix charset = UTF-8
    # Logged to stdout (smbd --debug-stdout): docker compose logs samba.
    log level = 1

# Films and shows, for the account alone.
[video]
    path = /volume1/video
    read only = yes
    guest ok = no
    valid users = houselights

# A second shared folder of the same NAS (issue #79).
[media]
    path = /volume1/media
    read only = yes
    guest ok = no
    valid users = houselights

[photos]
    path = /volume1/photos
    read only = yes
    guest ok = no
    valid users = houselights

# An administrative share, listed as Windows lists ADMIN$ and C$: a share list must leave out names ending in "$". The
# account may not open it.
[admin$]
    path = /volume1/admin
    read only = yes
    guest ok = no
    valid users = root

# Open to guests (an empty user in the app).
[public]
    path = /volume1/public
    read only = yes
    guest ok = yes
